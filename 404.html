<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/logo/aevia-icon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="assets/logo/aevia-icon-512.png"><link rel="apple-touch-icon" href="assets/logo/aevia-icon-180.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a1628">
<style>
:root{
  --navy:#0a1628;--navy-2:#0f1f36;--text:#f5f5f0;--muted:#aab4c2;
  --gold:#c9a437;--gold-deep:#b8960c;--line-2:#28394f;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--navy);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6;text-align:center}
.wrap{max-width:520px}
.logo{font-family:var(--serif);font-size:1.4rem;color:var(--text);text-decoration:none;display:inline-block;margin-bottom:40px}
.logo span{color:var(--gold)}
.code{font-family:var(--serif);font-size:4.5rem;font-weight:700;color:var(--gold);line-height:1}
h1{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin:14px 0 12px}
p{color:var(--muted);margin-bottom:28px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:999px;font-size:.97rem;font-weight:600;text-decoration:none;transition:all .2s ease;border:1px solid transparent}
.btn-primary{background:var(--gold);color:var(--navy)}
.btn-primary:hover{background:var(--gold-deep)}
.btn-ghost{border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{border-color:var(--gold)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media(max-width:1140px){.hamburger{display:flex;align-items:center;justify-content:center}.nav-links{position:fixed;inset:72px 0 auto 0;flex-direction:column;align-items:stretch;gap:0;background:var(--navy-2);border-bottom:1px solid var(--line);padding:10px 16px 22px;display:none}.nav-links.open{display:flex}.nav-links > li > a{padding:14px 6px;width:100%;font-size:1rem}.nav-cta{display:inline-block;margin-top:8px;text-align:center}.lang-li{padding:14px 6px;border-top:1px solid var(--line);justify-content:flex-start}}
</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="logo">Aevia<span>.</span></a>
    <div class="code">404</div>
    <h1>Siden her fandt vi ikke</h1>
    <p>Linket er måske flyttet eller skrevet forkert. Du finder hurtigt videre herfra.</p>
    <div class="row">
      <a href="index.html" class="btn btn-primary">Til forsiden</a>
      <a href="pakker.html" class="btn btn-ghost">Se pakker &amp; priser</a>
      <a href="book.html" class="btn btn-ghost">Book en tid</a>
    </div>
  </div>
<script src="glossary.js"></script>
</body>
</html>
