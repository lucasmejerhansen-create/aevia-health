<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Aevia · Booking-admin</title>
<style>
:root{--navy:#ffffff;--navy-2:#f6f8fb;--line-2:#d4dbe3;--text:#0a1628;--muted:#46505f;--muted-2:#697585;--gold:#8f7118;--gold-deep:#6f5912;--ok:#3fb27f;--bad:#e0844b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#ffffff;color:var(--text);line-height:1.5;padding:24px 16px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:4px}
.sub{color:var(--muted-2);font-size:.9rem;margin-bottom:22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;background:var(--navy-2);border:1px solid var(--line-2);border-radius:12px;padding:14px;margin-bottom:18px}
label{font-size:.78rem;color:var(--muted-2);display:block;margin-bottom:4px}
input,select{background:#ffffff;border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;color:var(--text);font:inherit;font-size:.92rem}
input:focus,select:focus{border-color:var(--gold)}input:focus-visible,select:focus-visible,.btn:focus-visible,.x:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn{background:var(--text);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;font:inherit;font-size:.9rem}
.btn:hover{background:var(--gold-deep)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line-2)}
.row{display:flex;align-items:flex-end;gap:6px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line-2);font-size:.9rem;vertical-align:top}
th{color:var(--muted-2);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}
.empty{color:var(--muted-2);padding:30px 0;text-align:center}
.tag{font-size:.72rem;padding:2px 9px;border-radius:999px;background:rgba(63,178,127,.15);color:#2e7d57}
.tag.cancelled{background:rgba(224,132,75,.15);color:#b3261e}
.x{background:none;border:1px solid var(--line-2);color:var(--muted);border-radius:8px;padding:5px 11px;font-size:.82rem;cursor:pointer}
.x:hover{border-color:var(--bad);color:var(--bad)}
.note{font-size:.82rem;color:var(--muted-2);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Booking-admin</h1>
  <p class="sub">Intern oversigt over bookinger i det integrerede system. Token gemmes kun i denne fane.</p>

  <div class="bar">
    <div><label for="tok">Admin-token</label><input id="tok" type="password" placeholder="ADMIN_TOKEN" style="width:170px"></div>
    <div><label for="area">Område</label><select id="area"></select></div>
    <div><label for="date">Dato</label><input id="date" type="date"></div>
    <div class="row"><button class="btn" onclick="load()">Hent</button></div>
  </div>

  <div id="out"><p class="empty">Indtast token, vælg område og dato, og tryk Hent.</p></div>
  <p class="note" id="cfgnote"></p>
</div>

<script>
var AREAS=[];
function tok(){return document.getElementById('tok').value.trim();}
function api(path){return fetch(path,{headers:{'Cache-Control':'no-store','Authorization':'Bearer '+tok()}}).then(function(r){return r.json();});}

// Init: hent områdeliste (offentligt endpoint)
api('/api/slots').then(function(d){
  AREAS=(d.areas||[]).map(function(a){return a.name;});
  var sel=document.getElementById('area');
  sel.innerHTML=AREAS.map(function(n){return '<option>'+n+'</option>';}).join('');
  document.getElementById('cfgnote').textContent=d.configured?'Datalager: konfigureret.':'Datalager IKKE konfigureret (sæt KV_REST_API_URL + KV_REST_API_TOKEN i Vercel).';
});
// default dato = i dag
document.getElementById('date').value=new Date().toISOString().slice(0,10);

function load(){
  if(!tok()){alert('Angiv admin-token');return;}
  var area=document.getElementById('area').value, date=document.getElementById('date').value;
  var out=document.getElementById('out'); out.innerHTML='<p class="empty">Henter…</p>';
  api('/api/admin-bookings?area='+encodeURIComponent(area)+'&date='+date)
    .then(function(d){
      if(d.error){out.innerHTML='<p class="empty">'+d.error+'</p>';return;}
      var b=d.bookings||[];
      if(!b.length){out.innerHTML='<p class="empty">Ingen bookinger '+date+' i '+area+'.</p>';return;}
      var rows=b.map(function(x){
        var cancelled=x.status==='cancelled';
        var tider=(x.parts||[]).map(function(p){return p.time+' <span style="color:var(--muted-2);font-size:.78rem">'+p.svc+'</span>';}).join('<br>')||x.time||'—';
        return '<tr><td>'+tider+'</td><td><strong>'+esc(x.customer&&x.customer.name||'')+'</strong><br><span style="color:var(--muted-2)">'+esc(x.customer&&x.customer.email||'')+(x.customer&&x.customer.phone?' · '+esc(x.customer.phone):'')+'</span></td><td>'+esc(x.customer&&x.customer.pkg||'—')+'</td><td>'+(cancelled?'<span class="tag cancelled">Aflyst</span>':'<span class="tag">Bekræftet</span>')+'</td><td>'+(cancelled?'':'<button class="x" onclick="cancelBk(\''+x.id+'\')">Aflys</button>')+'</td></tr>';
      }).join('');
      out.innerHTML='<table><thead><tr><th>Tid</th><th>Kunde</th><th>Pakke</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    }).catch(function(){out.innerHTML='<p class="empty">Netværksfejl.</p>';});
}
function cancelBk(id){
  if(!confirm('Aflys denne booking? Tiden frigives igen.'))return;
  fetch('/api/admin-bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok(),action:'cancel',id:id})})
    .then(function(r){return r.json();}).then(function(d){ if(d.ok)load(); else alert(d.reason||d.error||'Fejl'); });
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
</script>
</body>
</html>
