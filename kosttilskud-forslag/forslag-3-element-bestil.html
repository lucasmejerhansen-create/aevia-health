<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Din bestilling — Nuvera</title>
<meta name="description" content="Gennemse din personlige Nuvera-formel, vælg abonnement og bestil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg-soft:#f3f7fc;--navy:#0c2748;--navy-deep:#081b34;--navy-grad:#16386a;--sky:#3f86d6;--sky-soft:#e8f1fb;--sky-line:#cfe2f5;--good:#2f7a52;--good-soft:#e7f1ea;--ink:#0b1d36;--text-solid:#415064;--muted:#6e7c8d;--muted-2:#93a0b0;--line:#e6ecf3;--line-2:#d3deea;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text-solid);font-family:var(--sans);line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--navy);text-decoration:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;color:var(--ink);line-height:1.15}
h1{font-size:clamp(2rem,4.6vw,2.8rem)}
.container{max-width:1080px;margin:0 auto;padding:0 22px}
.eyebrow{display:inline-block;background:var(--sky-soft);color:var(--sky);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:7px 14px;border-radius:999px;margin-bottom:16px}
.lead{font-size:1.08rem;color:var(--muted);max-width:60ch}
header.site{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font-family:var(--serif);font-size:1.5rem;font-weight:700;color:var(--ink)}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none}
.nav-links a{padding:10px 14px;font-size:.9rem;color:var(--muted);font-weight:500}
.nav-cta{background:var(--navy)!important;color:#fff!important;border-radius:999px;padding:11px 22px!important}
@media(max-width:880px){.nav-links .hide-m{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 26px;border-radius:999px;font-size:.97rem;font-weight:600;cursor:pointer;transition:all .2s;border:2px solid transparent;font-family:inherit;line-height:1;width:100%}
.btn-primary{background:var(--sky);color:#fff}.btn-primary:hover{background:#2f74c4}
.btn-ghost{border:1px solid var(--line-2);color:var(--ink);background:#fff}
.intro{padding:48px 0 22px}.intro .lead{margin-top:12px}
.wrap{padding:14px 0 80px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}
.card h3{font-size:1.12rem;margin-bottom:3px}
.card .sub{font-size:.85rem;color:var(--muted);margin-bottom:16px}
.fitem{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.fitem:last-child{border-bottom:none}
.fitem .pdot{width:28px;height:28px;border-radius:8px;background:var(--sky-soft);color:var(--sky);display:flex;align-items:center;justify-content:center;flex:none}
.fitem .pdot svg{width:14px;height:14px}
.fitem b{color:var(--ink);font-size:.95rem}
.fitem small{display:block;color:var(--muted);font-size:.8rem}
.fitem .amt{margin-left:auto;color:var(--sky);font-weight:700;font-size:.9rem}
.tag{display:inline-block;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:5px;background:#e8f1fb;color:#2f6fb0;text-transform:uppercase}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{display:inline-flex;padding:9px 15px;border:1px solid var(--line-2);border-radius:999px;font-size:.88rem;color:var(--text-solid);cursor:pointer}
.opt input:checked+span{background:var(--sky);border-color:var(--sky);color:#fff}
.crow{padding:13px 0;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:none}
.crow .ct{font-weight:600;color:var(--ink);font-size:.95rem;margin-bottom:8px}
/* plan */
.plan{display:block;position:relative;border:1px solid var(--line-2);border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer}
.plan input{position:absolute;opacity:0}
.plan .pn{font-weight:600;color:var(--ink)}
.plan .pp{float:right;font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.plan .pd{font-size:.82rem;color:var(--muted)}
.plan.sel{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}
.sum{position:sticky;top:92px;background:#fff;border:1px solid var(--line-2);border-radius:18px;box-shadow:0 28px 64px -36px rgba(8,27,52,.55);overflow:hidden}
.sum .sh{background:linear-gradient(160deg,#0c2748,#16386a);color:#fff;padding:20px 24px}
.sum .sh .t{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#9fc0ec}
.sum .sh h3{color:#fff;margin-top:2px}
.sum .body{padding:20px 24px}
.line{display:flex;justify-content:space-between;font-size:.92rem;padding:7px 0;color:var(--text-solid)}
.line.tot{border-top:2px solid var(--line);margin-top:8px;padding-top:14px;font-size:1.05rem}
.line.tot b{font-family:var(--serif);font-size:1.5rem;color:var(--ink)}
.note{font-size:.8rem;color:var(--muted-2);margin-top:12px;line-height:1.5}
.empty{background:var(--bg-soft);border:1px solid var(--line);border-radius:18px;padding:46px 28px;text-align:center}
.empty h2{font-size:1.3rem;margin-bottom:8px}.empty p{color:var(--muted);margin-bottom:20px}
.empty .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.empty .btn{width:auto}
.done{background:var(--good-soft);border:1px solid #bfe0cb;border-radius:18px;padding:40px 28px;text-align:center}
.done .ic{width:56px;height:56px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.6rem}
.done h2{font-size:1.4rem;margin-bottom:8px}.done p{color:var(--text-solid)}
footer.site{border-top:1px solid var(--line);padding:40px 0 34px;background:var(--bg-soft)}
.foot-bottom{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:.82rem;color:var(--muted-2)}
@media(max-width:880px){.grid{grid-template-columns:1fr;gap:22px}.sum{position:static}}
</style>
</head>
<body>
<header class="site">
  <div class="container nav">
    <a href="forslag-3-element.html" class="logo">Nuvera<span style="color:#3f86d6">.</span></a>
    <ul class="nav-links">
      <li><a href="forslag-3-element-upload.html" class="hide-m">Upload rapport</a></li>
      <li><a href="forslag-3-element.html#priser" class="hide-m">Priser</a></li>
      <li><a href="forslag-3-element-abonnement.html" class="nav-cta">Min konto</a></li>
    </ul>
  </div>
</header>

<section class="intro"><div class="container">
  <span class="eyebrow">Bestilling</span>
  <h1>Din formel er klar</h1>
  <p class="lead">Gennemse sammensætningen, vælg dit abonnement, og bestil. Ingen binding — afmeld når som helst.</p>
</div></section>

<div class="wrap"><div class="container" id="root"></div></div>

<footer class="site"><div class="container">
  <div class="foot-bottom"><span>© 2026 Nuvera ApS · Demo-checkout. Kosttilskud er ikke lægemidler.</span><span><a href="forslag-3-element.html">← Tilbage til forsiden</a></span></div>
</div></footer>

<script>
(function(){
  var root=document.getElementById('root');
  var data=null;
  try{ data=JSON.parse(localStorage.getItem('nuvera_formel')||'null'); }catch(e){}

  if(!data || !data.items || !data.items.length){
    root.innerHTML='<div class="empty"><h2>Du har ikke bygget en formel endnu</h2><p>Byg din formel ud fra en blodprøve eller en kort profil — så lander den her.</p>'+
      '<div class="row"><a href="forslag-3-element-upload.html" class="btn btn-primary">Upload din rapport</a><a href="forslag-3-element-profil.html" class="btn btn-ghost">Byg uden test</a></div></div>';
    return;
  }

  var pill='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
  var PLANS=[
    {id:'start', n:'Start', p:399, d:'Op til 4 aktive · daglig drik'},
    {id:'element', n:'Nuvera', p:649, d:'Den fulde personlige formel', rec:true},
    {id:'pro', n:'Pro', p:1149, d:'Ubegrænset + diætist-samtale'}
  ];
  var freight=0;

  root.innerHTML =
    '<div class="grid"><div>'+
      '<div class="card"><h3>Din formel</h3><div class="sub">Kilde: '+(data.kilde||'profil')+(data.dato?(' · '+data.dato):'')+' · '+data.items.length+' aktive stoffer</div>'+
        data.items.map(function(i){ return '<div class="fitem"><span class="pdot">'+pill+'</span><div style="flex:1"><b>'+i.n+(i.cap?' <span class="tag">kapsel</span>':'')+'</b><small>'+(i.w||'')+'</small></div><span class="amt">'+(i.a||'')+'</span></div>'; }).join('')+
      '</div>'+
      '<div class="card"><h3>Levering &amp; smag</h3><div class="sub">Kan altid ændres i din konto.</div>'+
        '<div class="crow"><div class="ct">Leveringsinterval</div><div class="opts">'+
          '<label class="opt"><input type="radio" name="iv" value="4" checked><span>Hver 4. uge</span></label>'+
          '<label class="opt"><input type="radio" name="iv" value="6"><span>Hver 6. uge</span></label>'+
          '<label class="opt"><input type="radio" name="iv" value="8"><span>Hver 8. uge</span></label></div></div>'+
        '<div class="crow"><div class="ct">Smag</div><div class="opts">'+
          '<label class="opt"><input type="radio" name="sm" value="neutral" checked><span>Neutral</span></label>'+
          '<label class="opt"><input type="radio" name="sm" value="baer"><span>Bær</span></label>'+
          '<label class="opt"><input type="radio" name="sm" value="citrus"><span>Citrus</span></label></div></div>'+
      '</div>'+
      '<div class="card"><h3>Vælg abonnement</h3><div class="sub">Priser pr. måned inkl. moms.</div><div id="plans"></div></div>'+
    '</div>'+
    '<div><div class="sum"><div class="sh"><div class="t">Oversigt</div><h3>Din ordre</h3></div>'+
      '<div class="body"><div class="line"><span id="planName">Nuvera</span><span id="planPrice">649 kr/md</span></div>'+
        '<div class="line"><span>Fragt</span><span>Gratis</span></div>'+
        '<div class="line"><span>Levering</span><span id="ivLabel">hver 4. uge</span></div>'+
        '<div class="line tot"><span>Pr. måned</span><b id="total">649 kr</b></div>'+
        '<a href="#" id="pay" class="btn btn-primary" style="margin-top:16px">Gennemfør bestilling</a>'+
        '<p class="note">Demo — ingen betaling gennemføres. Din formel gennemgås af læge før første blanding. Afmeld når som helst.</p>'+
      '</div></div></div>'+
    '</div>';

  // plans
  var plansBox=document.getElementById('plans'); var selected='element';
  function renderPlans(){
    plansBox.innerHTML=PLANS.map(function(p){
      return '<label class="plan'+(p.id===selected?' sel':'')+'" data-id="'+p.id+'"><input type="radio" name="plan" '+(p.id===selected?'checked':'')+'>'+
        '<span class="pp">'+p.p+' kr</span><span class="pn">'+p.n+(p.rec?' · anbefalet':'')+'</span><div class="pd">'+p.d+'</div></label>';
    }).join('');
    [].forEach.call(plansBox.querySelectorAll('.plan'),function(el){ el.addEventListener('click',function(){ selected=el.getAttribute('data-id'); renderPlans(); upd(); }); });
  }
  function plan(){ for(var i=0;i<PLANS.length;i++){ if(PLANS[i].id===selected) return PLANS[i]; } return PLANS[1]; }
  function upd(){
    var p=plan();
    document.getElementById('planName').textContent=p.n;
    document.getElementById('planPrice').textContent=p.p+' kr/md';
    document.getElementById('total').textContent=p.p+' kr';
    var iv=document.querySelector('[name="iv"]:checked'); document.getElementById('ivLabel').textContent='hver '+(iv?iv.value:'4')+'. uge';
  }
  renderPlans(); upd();
  document.addEventListener('change', function(e){ if(e.target.name==='iv'||e.target.name==='sm') upd(); });

  document.getElementById('pay').addEventListener('click', function(e){
    e.preventDefault(); var p=plan();
    root.innerHTML='<div class="done"><div class="ic">✓</div><h2>Tak — din formel er bestilt</h2>'+
      '<p>'+p.n+' · '+p.p+' kr/md · '+data.items.length+' aktive stoffer. Vi sender en bekræftelse, og din læge gennemgår formlen før første blanding.</p>'+
      '<p style="margin-top:8px;font-size:.85rem;color:var(--muted)">(Demo — ingen betaling gennemført.)</p>'+
      '<div style="margin-top:20px"><a href="forslag-3-element-abonnement.html" class="btn btn-primary" style="width:auto;display:inline-flex">Gå til min konto</a></div></div>';
    window.scrollTo(0,0);
  });
})();
</script>
<script src="nuvera-nav.js"></script>
</body>
</html>
